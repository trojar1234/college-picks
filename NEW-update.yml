name: Update model

# GitHub runs schedules in UTC, so Central times shift by an hour when daylight saving time
# ends (first Sunday of November) and starts again (second Sunday of March).
#   UTC 13:07      = 8:07am CDT (Sep-Oct) / 7:07am CST (Nov-Jan)
#   UTC 23:07      = 6:07pm CDT / 5:07pm CST
#   UTC 15:07-23:07 Sat = 10am-6pm CDT / 9am-5pm CST
#   UTC 1:07, 3:07 Sun  = Sat 8pm, 10pm CDT / 7pm, 9pm CST
on:
  schedule:
    - cron: "7 13 * * *"              # Full update daily: results, ratings, grading, predictions
    - cron: "7 23 * * 1-5"            # Line snapshot weekday evenings
    - cron: "7 15,17,19,21,23 * * 6"  # Saturdays every 2 hours (lines close to kickoff)
    - cron: "7 1,3 * * 0"             # Saturday evening games
  workflow_dispatch:
    inputs:
      mode:
        description: "update (full), odds (lines only), or retune"
        default: update

permissions:
  contents: write

concurrency:
  group: model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Run model
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "7 13 * * *" ]; then MODE=update; else MODE=odds; fi
          fi
          echo "Mode: $MODE"
          python run.py "$MODE"
      # If any check fails, the job stops here: nothing is published and GitHub emails you.
      - name: Check before publishing
        run: python cfb_selftest.py
      - name: Save results
        run: |
          git config user.name "model-bot"
          git config user.email "model-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Model update $(date -u +%Y-%m-%dT%H:%MZ)"
          # pick up anything uploaded while this run was going, so the push never gets rejected
          git pull --rebase
          git push
